name: final-pr26231
on:
  push:
    branches: [final/pr26231, check/final26231-revert]
  workflow_dispatch:
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Maven 3.9.16
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Install upstream modules
        run: |
          mvn -v
          mvn -B -ntp install -DskipTests -am -pl appserver/orb/orb-http-protocol,appserver/orb/orb-http-client,appserver/orb/orb-http-server,appserver/orb/orb-http-codec-fory,appserver/orb/orb-http-glassfish
      - name: Strict build of the orb-http modules
        run: |
          mvn -B -ntp -fae -Dmaven.test.failure.ignore=true install -pl appserver/orb/orb-http-protocol,appserver/orb/orb-http-client,appserver/orb/orb-http-server,appserver/orb/orb-http-codec-fory,appserver/orb/orb-http-glassfish
