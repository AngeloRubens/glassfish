name: Batch 26215 check

on:
  workflow_dispatch:
  push:
    branches: [ 'ci/batch-26215-*', 'check/batch-26215-*' ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Maven 3.9.16
        run: |
          curl -sSL -o "$RUNNER_TEMP/maven.tgz" https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          tar -xzf "$RUNNER_TEMP/maven.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Build what the changed modules depend on
        run: |
          mvn -v
          mvn -B -ntp install -DskipTests -Dcheckstyle.skip -Dspotbugs.skip -Dcopyright.skip \
            -pl appserver/orb/orb-http-glassfish -am

      - name: Test the adapter with the change reverted and the tests kept
        run: |
          set -o pipefail
          mvn -B -ntp -fae install -Dcheckstyle.skip \
            -pl appserver/orb/orb-http-glassfish \
            2>&1 | tee build.log

      - name: Test and checkstyle summary
        if: always()
        run: |
          grep -hE 'Tests run:|FAIL|ERROR\]|WARN.*checkstyle|Reactor Summary|SUCCESS|BUILD' build.log | tail -200 || true

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*
            build.log
