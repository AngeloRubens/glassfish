name: Layer check ci/check-stack2-n3-e

on:
  workflow_dispatch:
  push:
    branches: [ 'ci/check-stack2-n3-e' ]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Maven 3.9.16
        shell: bash
        run: |
          curl -fsSL -o maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          mkdir -p "$HOME/maven"
          tar -xzf maven.tar.gz -C "$HOME/maven" --strip-components=1
          echo "$HOME/maven/bin" >> "$GITHUB_PATH"

      - name: Build what the modules depend on
        shell: bash
        run: |
          mvn -v
          mvn -B -e -ntp -Pqa,snapshots -DskipTests -pl appserver/orb/orb-http-protocol,appserver/orb/orb-http-codec-fory,appserver/orb/orb-http-client,appserver/orb/orb-http-server,appserver/orb/orb-http-glassfish,appserver/orb/orb-connector,appserver/ejb/ejb-container -am install 2>&1 | tee build.log

      - name: Verify the modules with all their tests and checkstyle
        shell: bash
        run: |
          mvn -B -e -ntp -Pqa,snapshots -pl appserver/orb/orb-http-protocol,appserver/orb/orb-http-codec-fory,appserver/orb/orb-http-client,appserver/orb/orb-http-server,appserver/orb/orb-http-glassfish,appserver/orb/orb-connector,appserver/ejb/ejb-container install 2>&1 | tee mvn.log

      - name: Summarize
        if: always()
        shell: bash
        run: |
          grep -hE "Tests run:.*Fail|ERROR|checkstyle|Building |BUILD|Reactor Summary" mvn.log build.log | tail -120 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: |
            appserver/orb/*/target/surefire-reports
            appserver/ejb/ejb-container/target/surefire-reports
            mvn.log
            build.log
