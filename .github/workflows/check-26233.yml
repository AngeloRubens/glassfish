name: Check batch 26233 revert

on:
  workflow_dispatch:
  push:
    branches: [ 'check/batch-26233-3-M' ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Maven 3.9.16
        shell: bash
        run: |
          curl -fsSL -o maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          mkdir -p "$HOME/maven"
          tar -xzf maven.tar.gz -C "$HOME/maven" --strip-components=1
          echo "$HOME/maven/bin" >> "$GITHUB_PATH"

      - name: Build the modules the Fory gRPC module depends on
        shell: bash
        run: |
          mvn -v
          mvn -B -e -ntp -Pqa,snapshots -DskipTests \
            -pl appserver/orb/orb-http-fory-grpc -am install 2>&1 | tee build.log

      - name: Verify the orb modules with all their tests and checkstyle
        shell: bash
        run: |
          mvn -B -e -ntp -fae -Dmaven.test.failure.ignore=true -Pqa,snapshots \
            -pl appserver/orb/orb-http-fory-grpc install 2>&1 | tee mvn.log

      - name: Summarize
        if: always()
        shell: bash
        run: |
          grep -hE "Tests run:.*Fail|checkstyle|Building orb|BUILD|Reactor Summary" mvn.log | tail -80 || true
          cat appserver/orb/orb-http-fory-grpc/target/surefire-reports/*ForyGrpcExtensionSecurityTest.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: |
            appserver/orb/*/target/surefire-reports
            mvn.log
