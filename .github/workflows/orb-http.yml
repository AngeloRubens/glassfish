# Continuous integration for the ORB-over-HTTP modules.
#
# Deliberately NOT part of the pull request to eclipse-ee4j/glassfish: that
# project builds on the Eclipse Foundation's Jenkins, and a GitHub Actions
# workflow in the PR would be infrastructure the maintainers did not ask for
# and do not run. This lives on a branch of the fork and exists for us.
#
# Two jobs, because they answer different questions.
#
#   unit    - do the modules build and do their own tests pass? Fast, hermetic,
#             runs on every push.
#
#   iiop    - what does a remote EJB over IIOP actually do, against a real
#             GlassFish? This is the baseline the HTTP transport claims to
#             reproduce. Today it establishes that baseline and nothing more:
#             the HTTP half cannot be run against a real server until the
#             adapter binding ContainerBridge to the container exists, so the
#             comparison this job is built for is still one-sided. It is here
#             so that the day the adapter lands, the second arm is a step
#             rather than a project.

name: ORB over HTTP

on:
  push:
    branches: [ 'ci-integration', 'orb-http-*' ]
  pull_request:
    branches: [ 'ci-integration' ]
  workflow_dispatch:

env:
  GLASSFISH_VERSION: 8.0.4

jobs:

  unit:
    name: Modules and their tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile with all warnings enabled
        run: |
          set -euo pipefail
          # javac directly rather than through the reactor: these three modules
          # have no GlassFish dependencies, which is a property worth keeping
          # and worth failing the build over if it is ever lost.
          mkdir -p /tmp/out/{protocol,client,server}
          EJB=$(find ~/.m2 -name 'jakarta.ejb-api-*.jar' | head -1 || true)
          if [ -z "$EJB" ]; then
            mvn -q dependency:get -Dartifact=jakarta.ejb:jakarta.ejb-api:4.0.1
            EJB=$(find ~/.m2 -name 'jakarta.ejb-api-*.jar' | head -1)
          fi
          javac -Werror -Xlint:all -d /tmp/out/protocol \
            $(find appserver/orb/orb-http-protocol/src/main/java -name '*.java')
          javac -Werror -Xlint:all -cp "/tmp/out/protocol:$EJB" -d /tmp/out/client \
            $(find appserver/orb/orb-http-client/src/main/java -name '*.java')
          # The server module needs jakarta.ejb too: applying the Enterprise
          # Beans exception contract means knowing what EJBException is.
          javac -Werror -Xlint:all -cp "/tmp/out/protocol:$EJB" -d /tmp/out/server \
            $(find appserver/orb/orb-http-server/src/main/java -name '*.java')

      - name: Checkstyle, with the project's own configuration
        run: |
          set -euo pipefail
          curl -sL -o /tmp/checkstyle.jar \
            https://github.com/checkstyle/checkstyle/releases/download/checkstyle-13.9.0/checkstyle-13.9.0-all.jar
          java -jar /tmp/checkstyle.jar \
            -c qa/src/main/resources/org/glassfish/qa/config/checkstyle/checkstyle.xml \
            $(find appserver/orb/orb-http-* -name '*.java') > /tmp/checkstyle.txt || true
          errors=$(grep -c '^\[ERROR\]' /tmp/checkstyle.txt || true)
          echo "checkstyle errors: $errors"
          grep '^\[ERROR\]' /tmp/checkstyle.txt || true
          test "$errors" -eq 0

      - name: Run the tests
        run: ci/run-unit-tests.sh

  iiop:
    name: IIOP baseline against a real GlassFish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download GlassFish ${{ env.GLASSFISH_VERSION }}
        run: |
          set -euo pipefail
          curl -sL -o /tmp/glassfish.zip \
            "https://github.com/eclipse-ee4j/glassfish/releases/download/${GLASSFISH_VERSION}/glassfish-${GLASSFISH_VERSION}.zip"
          unzip -q /tmp/glassfish.zip -d /opt
          echo "GLASSFISH_HOME=/opt/glassfish8" >> "$GITHUB_ENV"

      - name: Start the domain
        run: |
          set -euo pipefail
          "$GLASSFISH_HOME/bin/asadmin" start-domain
          "$GLASSFISH_HOME/bin/asadmin" list-domains

      - name: Build and deploy the test bean
        run: |
          set -euo pipefail
          # Only the two modules this arm needs. client-http depends on the
          # transport, and a control arm that cannot build without the thing
          # it is controlling for is not a control.
          mvn -q -f ci/iiop-baseline/pom.xml -pl bean,client package
          "$GLASSFISH_HOME/bin/asadmin" deploy --force \
            ci/iiop-baseline/bean/target/orb-baseline-bean.jar
          "$GLASSFISH_HOME/bin/asadmin" list-applications

      - name: Invoke it over IIOP and check what a remote view actually carries
        run: |
          set -euo pipefail
          # Use the app client container rather than assembling a classpath by
          # hand. gf-client.jar turns out to be an OSGi bundle with no
          # Class-Path manifest, and naming the module directory instead gets
          # far enough to boot HK2 and then fails on jars that live elsewhere.
          # appclient is what GlassFish ships for running a remote client, and
          # it knows where its own pieces are.
          "$GLASSFISH_HOME/glassfish/bin/appclient" \
            -client ci/iiop-baseline/client/target/orb-baseline-client.jar

      - name: Server log on failure
        if: failure()
        run: tail -200 "$GLASSFISH_HOME/glassfish/domains/domain1/logs/server.log" || true

      - name: Stop the domain
        if: always()
        run: |
          "$GLASSFISH_HOME/bin/asadmin" stop-domain || true

  reactor:
    name: Maven reactor build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # -am builds the GlassFish modules these depend on, which is most of the
      # cost and all of the point: it is what proves the poms are right, that
      # the project's own checkstyle plugin passes, and that surefire runs the
      # tests. Doing it here rather than on a laptop is the difference between
      # a claim and a check anyone can repeat.
      - name: Build the transport modules through the reactor
        run: |
          mvn -B -am -DskipTests=false \
            -pl appserver/orb/orb-http-protocol,appserver/orb/orb-http-client,appserver/orb/orb-http-server \
            install

      - name: Build the container integration module
        # -am: this one depends on ejb-container, glassfish-naming, the kernel
        # and Grizzly, none of which exist as 8.0.5-SNAPSHOT until built.
        run: mvn -B -DskipTests -am -pl appserver/orb/orb-http-glassfish install

      - name: Build the Fory codec module
        # Depends only on orb-http-protocol, already installed above. Its tests
        # run here: it is the one module whose correctness is a claim about a
        # third-party library, so it should be checked where anyone can see it.
        run: mvn -B -DskipTests=false -pl appserver/orb/orb-http-codec-fory install

      - name: Check the modules are OSGi bundles
        run: |
          set -euo pipefail
          # A plain jar in GlassFish's module directory exports nothing and is
          # invisible to the container. This has been wrong once already.
          for m in orb-http-protocol orb-http-client orb-http-server orb-http-glassfish orb-http-codec-fory; do
            jar=$(find ~/.m2/repository -name "$m-*.jar" ! -name '*sources*' | head -1)
            echo "-- $m"
            unzip -p "$jar" META-INF/MANIFEST.MF | grep -q 'Bundle-SymbolicName' \
              || { echo "   NOT an OSGi bundle"; exit 1; }
            unzip -p "$jar" META-INF/MANIFEST.MF | grep 'Bundle-SymbolicName'
          done

      - name: Keep the jars for the integration job
        uses: actions/upload-artifact@v4
        with:
          name: orb-http-modules
          path: ~/.m2/repository/org/glassfish/main/orb/orb-http-*/**/*.jar
          retention-days: 1

  http:
    name: HTTP transport against a real GlassFish
    runs-on: ubuntu-latest
    needs: reactor
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download GlassFish ${{ env.GLASSFISH_VERSION }}
        run: |
          set -euo pipefail
          curl -sL -o /tmp/glassfish.zip \
            "https://github.com/eclipse-ee4j/glassfish/releases/download/${GLASSFISH_VERSION}/glassfish-${GLASSFISH_VERSION}.zip"
          unzip -q /tmp/glassfish.zip -d /opt
          echo "GLASSFISH_HOME=/opt/glassfish8" >> "$GITHUB_ENV"

      - name: Build the modules
        run: |
          mvn -B -am -DskipTests \
            -pl appserver/orb/orb-http-protocol,appserver/orb/orb-http-client,appserver/orb/orb-http-server \
            install
          # -am on both. Without it these resolve only when the Maven cache
          # happens to still hold the 8.0.5-SNAPSHOT artifacts another job
          # built - which it does until a pom changes and the cache key with
          # it. A job should not depend on that.
          mvn -B -DskipTests -am -pl appserver/orb/orb-http-glassfish install
          mvn -B -DskipTests -am -pl appserver/orb/orb-http-codec-fory install

      - name: Inject them into the server
        run: |
          set -euo pipefail
          # The jars are 8.0.5-SNAPSHOT and the server is a released 8.0.4.
          # If OSGi refuses them on a version range this is where it shows,
          # and the answer would be to build the distribution from source
          # instead. Trying the cheap thing first, and saying so.
          for m in orb-http-protocol orb-http-client orb-http-server orb-http-glassfish orb-http-codec-fory; do
            jar=$(find ~/.m2/repository/org/glassfish/main/orb -name "$m-*.jar" ! -name '*sources*' | head -1)
            echo "installing $(basename "$jar")"
            cp "$jar" "$GLASSFISH_HOME/glassfish/modules/"
          done

          # The transport also extends GlassFish's own SPI - EjbContainerFacade
          # gained createSession, and the stateful container implements it - so
          # the released 8.0.4 copies of those two modules have to be replaced
          # as well. Without this the server runs the stock interface and the
          # adapter calls a method that is not there: NoSuchMethodError, at the
          # first stateful lookup.
          for m in orb-connector ejb-container; do
            jar=$(find ~/.m2/repository/org/glassfish/main -name "$m-8.0.5-SNAPSHOT.jar" ! -name '*sources*' | head -1)
            target=$(find "$GLASSFISH_HOME/glassfish/modules" -name "$m.jar" | head -1)
            if [ -n "$jar" ] && [ -n "$target" ]; then
              echo "replacing $(basename "$target") with $(basename "$jar")"
              cp "$jar" "$target"
            else
              echo "::error::could not replace $m (built=$jar target=$target)"
              exit 1
            fi
          done

      - name: Start the domain and deploy the bean
        run: |
          set -euo pipefail
          "$GLASSFISH_HOME/bin/asadmin" start-domain
          mvn -B -q -f ci/iiop-baseline/pom.xml package
          "$GLASSFISH_HOME/bin/asadmin" deploy --force \
            ci/iiop-baseline/bean/target/orb-baseline-bean.jar

      - name: Did the endpoint actually mount?
        run: |
          set -euo pipefail
          grep -i "glassfish-services\|OrbHttpEndpoint" \
            "$GLASSFISH_HOME/glassfish/domains/domain1/logs/server.log" || true
          # A 404 means routed but no such operation, which is a mounted
          # endpoint. Connection refused means it never mounted.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:8080/glassfish-services/common/v1/affinity" || echo "000")
          echo "affinity endpoint answered: $code"
          test "$code" != "000"

      - name: What did the index see?
        run: |
          grep -E "EJB name index|EJB bundle|indexed .* bean key" \
            "$GLASSFISH_HOME/glassfish/domains/domain1/logs/server.log" || \
            echo "(the index never ran - nothing has asked it to resolve a name yet)"

      - name: Invoke the same bean over HTTP
        run: |
          set -euo pipefail
          cp="ci/iiop-baseline/client-http/target/orb-baseline-client-http.jar"
          cp="$cp:ci/iiop-baseline/client/target/orb-baseline-client.jar"
          for m in orb-http-client orb-http-protocol; do
            cp="$cp:$(find ~/.m2/repository/org/glassfish/main/orb -name "$m-*.jar" ! -name '*sources*' | head -1)"
          done
          cp="$cp:$(find ~/.m2/repository/jakarta/ejb -name 'jakarta.ejb-api-*.jar' | head -1)"
          echo "classpath: $cp"
          set +e
          java -cp "$cp" org.glassfish.orb.baseline.HttpBaseline 2>&1 | tee /tmp/http.log
          status=${PIPESTATUS[0]}
          set -e
          # Repeat the outcome as annotations. Job logs need a signed-in
          # session to read; annotations do not, and without this the only
          # thing visible from outside is "exit code 1".
          grep -E "^ *(ok|FAIL)" /tmp/http.log | while read -r line; do
            echo "::notice::jser: $line"
          done
          exit $status

      - name: Is the Fory codec discovered without the application asking?
        # always(): the step before fails on the one scenario that is known
        # not to be implemented, and that must not decide whether the codec
        # gets exercised. They are unrelated claims.
        if: always()
        run: |
          set -euo pipefail
          # Same client program, same bean, same call. The only difference is
          # that the codec module is on the class path - no import, no code
          # change. -Dcodec=fory makes the client require it, so a silent
          # fallback to Java serialization fails the job instead of passing
          # while proving nothing.
          cp="ci/iiop-baseline/client-http/target/orb-baseline-client-http.jar"
          cp="$cp:ci/iiop-baseline/client/target/orb-baseline-client.jar"
          for m in orb-http-client orb-http-protocol orb-http-codec-fory; do
            cp="$cp:$(find ~/.m2/repository/org/glassfish/main/orb -name "$m-*.jar" ! -name '*sources*' | head -1)"
          done
          cp="$cp:$(find ~/.m2/repository/jakarta/ejb -name 'jakarta.ejb-api-*.jar' | head -1)"
          # The bundle carries fory and janino as nested jars, which a flat
          # class path cannot read, so the client gets them directly.
          for a in org/apache/fory/fory-core org/codehaus/janino/janino org/codehaus/janino/commons-compiler; do
            cp="$cp:$(find ~/.m2/repository/$a -name '*.jar' ! -name '*sources*' | head -1)"
          done
          echo "classpath: $cp"
          set +e
          java -cp "$cp" -Dcodec=fory org.glassfish.orb.baseline.HttpBaseline 2>&1 | tee /tmp/fory.log
          status=${PIPESTATUS[0]}
          set -e
          grep -E "^ *(ok|FAIL)|requiring codec" /tmp/fory.log | while read -r line; do
            echo "::notice::fory: $line"
          done
          # The first exception line too: which codec failed and how is the
          # whole question this step exists to answer.
          grep -m3 -E "Exception|Caused by" /tmp/fory.log | while read -r line; do
            echo "::error::fory: $line"
          done
          exit $status

      - name: Did the server actually load the codec bundle?
        if: always()
        run: |
          grep -iE "fory|codec" \
            "$GLASSFISH_HOME/glassfish/domains/domain1/logs/server.log" | tail -20 || \
            echo "(nothing about the codec in the log)"
          # The scanner says what it found; that line is the answer to whether
          # cross-bundle discovery worked, so put it where it can be read.
          grep -h "codecs available\|registered the" \
            "$GLASSFISH_HOME/glassfish/domains/domain1/logs/server.log" | tail -5 | \
            while read -r line; do echo "::notice::server: $line"; done || true
          # Whatever the server itself complained about. Until now the only
          # account of a server-side failure was the client's description of
          # a connection that ended.
          grep -hE "SEVERE|WARNING|Exception" \
            "$GLASSFISH_HOME/glassfish/domains/domain1/logs/server.log" | tail -8 | \
            while read -r line; do echo "::error::server: ${line:0:400}"; done || true

      - name: What the index saw, after the attempt
        if: always()
        run: |
          grep -E "EJB name index|EJB bundle|indexed .* bean key" \
            "$GLASSFISH_HOME/glassfish/domains/domain1/logs/server.log" || true

      - name: Server log on failure
        if: failure()
        run: tail -300 "$GLASSFISH_HOME/glassfish/domains/domain1/logs/server.log" || true

      - name: Stop the domain
        if: always()
        run: |
          "$GLASSFISH_HOME/bin/asadmin" stop-domain || true
