name: Check n3-revert-ra

on:
  workflow_dispatch:
  push:
    branches: [ 'check5/n3-revert-ra' ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Maven 3.9.16
        shell: bash
        run: |
          curl -fsSL -o maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          mkdir -p "$HOME/maven"
          tar -xzf maven.tar.gz -C "$HOME/maven" --strip-components=1
          echo "$HOME/maven/bin" >> "$GITHUB_PATH"

      - name: Build the dependencies
        shell: bash
        run: |
          mvn -v
          mvn -B -e -ntp -Pqa,snapshots -DskipTests -pl appserver/orb/orb-http-protocol,appserver/orb/orb-http-client,appserver/orb/orb-http-server,appserver/orb/orb-http-codec-fory,appserver/orb/orb-http-glassfish -am install 2>&1 | tee build.log

      - name: Strict build of the orb http modules
        shell: bash
        run: |
          mvn -B -e -ntp -Pqa,snapshots -pl appserver/orb/orb-http-protocol,appserver/orb/orb-http-client,appserver/orb/orb-http-server,appserver/orb/orb-http-codec-fory,appserver/orb/orb-http-glassfish install 2>&1 | tee mvn.log

      - name: Summarize
        if: always()
        shell: bash
        run: |
          grep -hE "Tests run:.*Time|Tests run:.*Fail.*$|checkstyle|You have [0-9]+ Checkstyle|Building orb|BUILD|Reactor Summary|SUCCESS|FAILURE" mvn.log | grep -v "Tests run:.*in org" | tail -120 || true
